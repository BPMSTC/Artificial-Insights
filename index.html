<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Artificial Insights Index</title>
    <style>
      :root {
        --text: #0f172a;
        --muted: #475569;
        --rule: #e2e8f0;
        --accent: #2563eb;
        --accent-soft: #dbeafe;
        --card: #ffffff;
        --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      }
      body {
        font-family: "Segoe UI", Arial, Helvetica, sans-serif;
        color: var(--text);
        margin: 0;
        background: #f8fafc;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 28px 20px 64px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      header img {
        width: 48px;
        height: 48px;
        object-fit: contain;
      }
      header h1 {
        margin: 0 0 6px;
        font-size: 30px;
        letter-spacing: 0.2px;
      }
      header p {
        margin: 0;
        color: var(--muted);
      }
      .banner {
        margin: 18px 0 8px;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }
      .banner img {
        width: 100%;
        display: block;
      }
      .issue {
        margin-top: 22px;
        background: var(--card);
        border: 1px solid var(--rule);
        border-radius: 14px;
        padding: 16px 18px;
        box-shadow: var(--shadow);
      }
      .issue h2 {
        margin: 0 0 6px;
        font-size: 20px;
      }
      .issue p {
        margin: 0 0 12px;
        color: var(--muted);
      }
      .links a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
        margin-right: 14px;
        background: var(--accent-soft);
        padding: 6px 10px;
        border-radius: 10px;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="assets/images/artificial%20insights%20logo.png" alt="Artificial Insights logo">
        <div>
          <h1>Artificial Insights</h1>
          <p>Bi-weekly updates for coworkers</p>
        </div>
      </header>

      <div class="banner">
        <img src="assets/images/artificial%20insights%20header.png" alt="Artificial Insights banner">
      </div>

      <section class="issue">
        <h2>Jan 29, 2026</h2>
        <p>Excel AI improvements, health/education initiatives, and new AI shopping and ads.</p>
        <div class="links">
          <a href="issues/2026-01-29.html">Read issue</a>
          <a href="sources/2026-01-29.html">Sources</a>
        </div>
      </section>
    </main>
  </body>
</html>
