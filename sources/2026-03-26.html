        --muted: #64748b;

        --accent-hover: #1d4ed8;
        --accent-soft: #dbeafe;
        --card: #ffffff;
        --bg: #f8fafc;

      * { box-sizing: border-box; }
      body {

        color: var(--text);
        margin: 0;
        background: var(--bg);
        line-height: 1.7;
      }
      .top-bar {
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        color: #fff;
        padding: 12px 20px;
        font-size: 13px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }
      .top-bar a {
        color: #94a3b8;
        text-decoration: none;
        transition: color 0.15s;
      }
      .top-bar a:hover { color: #fff; }
      .top-bar .date { color: #94a3b8; }
      .container {
        max-width: 720px;
        margin: 0 auto;
        padding: 0 20px 60px;
      }
      .header {
        text-align: center;
        padding: 32px 0 24px;
      }
      .header img {
        max-width: 100%;
        border-radius: 16px;
        box-shadow: var(--shadow);
      }
      .nav-links {
        display: flex;
        justify-content: center;
        gap: 24px;
        padding: 16px 0;
        border-bottom: 2px solid var(--rule);
        margin-bottom: 24px;
        flex-wrap: wrap;
      }
      .nav-links a {
        color: var(--muted);
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        padding: 6px 12px;
        border-radius: 6px;
        transition: all 0.15s;
      }
      .nav-links a:hover {
        color: var(--accent);
        background: var(--accent-soft);
      }
      h1 {
        font-size: 32px;
        margin: 32px 0 8px;
        letter-spacing: -0.5px;
      }
      .meta {
        color: var(--muted);
        font-size: 15px;
        margin-bottom: 32px;
      }
      h3 {
        font-size: 18px;
        margin: 28px 0 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      ul {
        margin: 0 0 20px;
        padding-left: 24px;
      }
      li {
        margin-bottom: 8px;
      }
      a {
        color: var(--accent);
        text-decoration: none;
        transition: color 0.15s;
      }
      a:hover {
        color: var(--accent-hover);
        text-decoration: underline;
      }
      footer {
        border-top: 2px solid var(--rule);
        padding: 36px 0;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        margin-top: 48px;
      }
      footer a {
        color: var(--muted);
      }
      footer a:hover { color: var(--accent); }
      footer .footer-links {
        margin-bottom: 16px;
        display: flex;
        justify-content: center;
        gap: 24px;
        flex-wrap: wrap;
      }
      footer .brand {
        font-weight: 700;
        color: var(--text);
        font-size: 14px;
      }
      @media (max-width: 600px) {
        h1 { font-size: 26px; }
        h3 { font-size: 16px; }
      }
