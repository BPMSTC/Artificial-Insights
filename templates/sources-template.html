<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}} - Sources</title>
    <style>
      :root {
        --text: #0f172a;
        --muted: #475569;
        --rule: #e2e8f0;
        --accent: #2563eb;
        --card: #ffffff;
        --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      }
      body {
        font-family: "Segoe UI", Arial, Helvetica, sans-serif;
        color: var(--text);
        margin: 0;
        background: #f8fafc;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 28px 20px 64px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      header img {
        width: 48px;
        height: 48px;
        object-fit: contain;
      }
      header h1 {
        margin: 0 0 6px;
        font-size: 28px;
        letter-spacing: 0.2px;
      }
      header p {
        margin: 0;
        color: var(--muted);
      }
      .banner {
        margin: 18px 0 8px;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }
      .banner img {
        width: 100%;
        display: block;
      }
      .section {
        margin-top: 22px;
        background: var(--card);
        border: 1px solid var(--rule);
        border-radius: 14px;
        padding: 16px 18px;
        box-shadow: var(--shadow);
      }
      .section h2 {
        margin: 0 0 10px;
        font-size: 20px;
      }
      ul {
        margin: 0;
        padding-left: 18px;
      }
      li {
        margin: 6px 0;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="../assets/images/artificial%20insights%20logo.png" alt="Artificial Insights logo">
        <div>
          <h1>{{title}} - Sources</h1>
          <p>{{date}}</p>
        </div>
      </header>

      <div class="banner">
        <img src="../assets/images/artificial%20insights%20header.png" alt="Artificial Insights banner">
      </div>

      <section class="section">
        <h2>News</h2>
        <ul>
          <li><a href="{{news_source_1_url}}">{{news_source_1_label}}</a></li>
        </ul>
      </section>

      <section class="section">
        <h2>New Tools</h2>
        <ul>
          <li><a href="{{tools_source_1_url}}">{{tools_source_1_label}}</a></li>
        </ul>
      </section>

      <section class="section">
        <h2>Analysis</h2>
        <ul>
          <li><a href="{{analysis_source_1_url}}">{{analysis_source_1_label}}</a></li>
        </ul>
      </section>

      <section class="section">
        <h2>Education Impact</h2>
        <ul>
          <li><a href="{{education_source_1_url}}">{{education_source_1_label}}</a></li>
        </ul>
      </section>

      <section class="section">
        <h2>Demonstrations</h2>
        <ul>
          <li><a href="{{demo_source_1_url}}">{{demo_source_1_label}}</a></li>
        </ul>
      </section>
    </main>
  </body>
</html>
